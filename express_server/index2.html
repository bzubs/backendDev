<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Calc</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Simple Calculator</h1>
    <input id="a" type="text" placeholder="value1">
    <input id="b" type="text" placeholder="value2">

    <div id="result"></div>

    <button id="add" onclick="sendAddRequest()">Add</button>
    <button id="subtract" onclick="sendSubtractRequest()">Subtract</button>
    <button id="multiply" onclick="sendMultiplyRequest()">Multiply</button>
    <button id="divide" onclick="sendDivideRequest()">Divide</button>
    
    <script src="index2.js"></script>
</body>
</html>
